# 推送 main 分支后自动构建并部署到 GitHub Pages
# 说明：工作流会尝试自动把 Pages 切换为 "GitHub Actions" 构建方式；
#      若 token 权限不足导致切换失败，会明确报错并提示手动设置一次：
#      Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 校验并切换到 GitHub Actions 构建方式
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)
          echo "当前 Pages build_type = ${current:-未知（站点可能尚未创建）}"

          if [ -z "$current" ]; then
            echo "尝试创建 Pages 站点（workflow 模式）…"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)
          fi

          if [ "$current" != "workflow" ]; then
            echo "尝试切换为 GitHub Actions 构建…"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)
            echo "切换后 build_type = ${current:-未知}"
          fi

          if [ "$current" != "workflow" ]; then
            echo "::error::Pages 当前不是 GitHub Actions 构建模式，部署不会生效。请在仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”，然后重新运行本工作流（Actions → Deploy to GitHub Pages → Re-run all jobs）。"
            exit 1
          fi
          echo "✓ Pages 构建方式 = workflow，继续部署"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
